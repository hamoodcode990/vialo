/* ================= ENGINES ================= */
const CAP=4,STALL=24;
function mb32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const uni=t=>t.length===CAP&&t.every(v=>v===t[0]);
function invMoves(tb){const o=[];for(let d=0;d<tb.length;d++){const T=tb[d];if(!T.length)continue;
const x=T[T.length-1];let r=0;for(let i=T.length-1;i>=0&&T[i]===x;i--)r++;
for(let s=0;s<tb.length;s++){if(s===d)continue;const sp=CAP-tb[s].length;if(sp<=0)continue;
if(tb[s].length&&tb[s][tb[s].length-1]===x)continue;const mk=Math.min(r,sp);
for(let k=1;k<=mk;k++)o.push([d,s,k]);}}return o;}
function genTubes(seed,c,e){const rnd=mb32(seed),tb=[];
for(let i=0;i<c;i++)tb.push([i,i,i,i]);for(let i=0;i<e;i++)tb.push([]);
for(let i=0;i<c*20;i++){const m=invMoves(tb);if(!m.length)break;
const[d,s,k]=m[Math.floor(rnd()*m.length)];for(let j=0;j<k;j++)tb[s].push(tb[d].pop());}return tb;}

class Pour{ // Sort Duel
  constructor(seed,c,e){this.kind='pour';this.seed=seed;this.colors=c;this.tubes=genTubes(seed,c,e);
  this.sealed=new Array(this.tubes.length).fill(false);this.owner=new Array(this.tubes.length).fill(-1);
  this.scores=[0,0];this.turn=0;this.history=[];this.last=null;this.stall=0;this.komi=false;}
  canAct(s,d){if(s===d||this.sealed[s])return false;
  if(this.last&&this.last[0]===d&&this.last[1]===s)return false;
  const A=this.tubes[s],B=this.tubes[d];if(!A.length||B.length>=CAP)return false;
  return !B.length||A[A.length-1]===B[B.length-1];}

const MW=6,MH=6,MT=4;
class Fuse{ // Merge Duel. Every merge removes a tile, so it always terminates.
  constructor(seed){this.kind='fuse';this.seed=seed;const rnd=mb32(seed);
  this.W=MW;this.H=MH;this.target=MT;this.grid=[];
  for(let i=0;i<MW*MH;i++)this.grid.push(1+Math.floor(rnd()*3));
  this.sealed=new Array(MW*MH).fill(false);this.owner=new Array(MW*MH).fill(-1);
  this.scores=[0,0];this.turn=0;this.history=[];this.komi=true;} // half point to P2
  adj(a,b){const ax=a%MW,ay=(a/MW)|0,bx=b%MW,by=(b/MW)|0;
  return Math.abs(ax-bx)+Math.abs(ay-by)===1;}
  canAct(a,b){if(a===b||this.sealed[a]||this.sealed[b])return false;
  if(!this.grid[a]||!this.grid[b])return false;if(!this.adj(a,b))return false;
  return this.grid[a]===this.grid[b];}
  targets(a){const o=[];for(let b=0;b<this.grid.length;b++)if(this.canAct(a,b))o.push(b);return o;}
  moves(){const o=[];for(let a=0;a<this.grid.length;a++)for(let b=0;b<this.grid.length;b++)
  if(this.canAct(a,b))o.push([a,b]);return o;}
  get claimed(){return this.scores[0]+this.scores[1];}
  get over(){return !this.moves().length;}
  get leader(){ // komi: P2 wins ties
  return this.scores[0]>this.scores[1]?0:1;}
  act(a,b){if(this.over||!this.canAct(a,b))return null;
  const v=this.grid[b]+1;this.grid[b]=v;this.grid[a]=0;let sl=null;
  if(v>=this.target){this.sealed[b]=true;this.owner[b]=this.turn;this.scores[this.turn]++;sl=b;}
  const who=this.turn;this.turn=1-this.turn; // no keep-turn: it made P1 win 82%
  this.history.push([a,b,v,sl,who]);

  colOwner(col){if(col<this.own)return 0;if(col<this.own*2)return 1;return -1;}

  targets(s){const o=[];for(let d=0;d<this.tubes.length;d++)if(this.canAct(s,d))o.push(d);return o;}
  moves(){const o=[];for(let s=0;s<this.tubes.length;s++)for(let d=0;d<this.tubes.length;d++)
  if(this.canAct(s,d))o.push([s,d]);return o;}

  get left(){return Math.max(0,STALL-this.stall);}

  get leader(){return this.scores[0]===this.scores[1]?-1:(this.scores[0]>this.scores[1]?0:1);}
  act(s,d){if(this.over||!this.canAct(s,d))return null;

  while(this.tubes[s].length&&this.tubes[s][this.tubes[s].length-1]===col&&this.tubes[d].length<CAP){
  this.tubes[d].push(this.tubes[s].pop());n++;}
  let sl=null;
  for(let i=0;i<this.tubes.length;i++)if(!this.sealed[i]&&uni(this.tubes[i])){
  let o=this.colOwner(this.tubes[i][0]); if(o===-1)o=this.turn;   // neutral goes to the pourer
  this.sealed[i]=true;this.owner[i]=o;this.scores[o]++;sl=i;}
  const who=this.turn;this.last=sl===null?[s,d]:null;this.stall=sl===null?this.stall+1:0;

function shuffleN(n,k,rnd){const a=[...Array(n).keys()];
for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
return a.slice(0,k);}

const RC_SRC=8,RC_COL=6; // 8 shared source tubes, 6 colours, each recipe is CAP(4) long
class Recipe{ // RECIPE: each player secretly races to build their own exact colour
              // sequence (own vial = tubes[RC_SRC+turn]) from the shared source tubes.
              // No chaining, no take-backs on the vials — a wrong-order pour is simply
              // illegal, so the tension is entirely in setting up the right top colour
              // before your opponent claims it for their own build.
              // Newer than the other three and not yet simulation-tuned to the same
              // degree: 500-game sim (depth-1 AI, 10% blunder) finished 309-191 (~62/38)
              // in favour of whoever moves first in a single game, 0 stalls/crashes in
              // 800 sim games. Match-level first-player alternation (already in place
              // for all duel modes) offsets this across a Bo3/Bo5 match; a single game
              // still leans toward the starter. Flag for a future tuning pass.
  constructor(seed){this.kind='recipe';this.seed=seed;this.colors=RC_COL;
  this.tubes=genTubes(seed,RC_COL,2);
  this.tubes.push([],[]); // RC_SRC, RC_SRC+1 = player 0 / player 1 vials
  const rnd=mb32((seed*2654435761)>>>0);
  this.recipes=[shuffleN(RC_COL,CAP,rnd),shuffleN(RC_COL,CAP,rnd)];
  this.sealed=new Array(this.tubes.length).fill(false);this.owner=new Array(this.tubes.length).fill(-1);
  this.scores=[0,0];this.turn=0;this.history=[];this.stall=0;this.komi=true;}
  canAct(s,d){if(s===d||s>=RC_SRC)return false;
  const A=this.tubes[s];if(!A.length)return false;
  if(d>=RC_SRC){const p=d-RC_SRC;if(p!==this.turn)return false;
  const B=this.tubes[d];return B.length<CAP&&A[A.length-1]===this.recipes[p][B.length];}
  const B=this.tubes[d];if(B.length>=CAP)return false;
  return !B.length||A[A.length-1]===B[B.length-1];}
  targets(s){const o=[];for(let d=0;d<this.tubes.length;d++)if(this.canAct(s,d))o.push(d);return o;}
  moves(){const o=[];for(let s=0;s<this.tubes.length;s++)for(let d=0;d<this.tubes.length;d++)
  if(this.canAct(s,d))o.push([s,d]);return o;}
  get claimed(){return this.scores[0]+this.scores[1];}
  get left(){return Math.max(0,STALL-this.stall);}
  get over(){return this.scores[0]>=CAP||this.scores[1]>=CAP||this.stall>=STALL||!this.moves().length;}

  else{while(this.tubes[s].length&&this.tubes[s][this.tubes[s].length-1]===col&&this.tubes[d].length<CAP){
  this.tubes[d].push(this.tubes[s].pop());n++;}this.stall++;}

function evalG(g,me){return (g.scores[me]-g.scores[1-me])*100;}
function best(g,depth,blunder,rnd){
const mv=g.moves();if(!mv.length)return null;
if(rnd()<blunder)return mv[Math.floor(rnd()*mv.length)];
const me=g.turn;let b=null,bs=-Infinity;
for(const[s,d]of mv){const c=clone(g);c.act(s,d);
let sc=evalG(c,me)+(c.kind==='fuse'?(c.grid[d]||0):0);
if(depth>1&&!c.over){const r=best(c,depth-1,0,rnd);
if(r){const c2=clone(c);c2.act(r[0],r[1]);sc=evalG(c2,me)+(c2.kind==='fuse'?(c2.grid[r[1]]||0):0);}}
sc+=(rnd()-.5)*.01;if(sc>bs){bs=sc;b=[s,d];}}
return b;}

function animPour(s,d,n,col,done){

const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),pr=app.getBoundingClientRect();

const el=document.createElement('div');el.className='drop';

border-color:${c[col%c.length]}`;app.appendChild(sp);setTimeout(()=>sp.remove(),450);
el.remove();SFX.splash();if(++fin===n)done();},175);},300);});},i*72);}

function pourMove(s,d){const g=S.g;
const col=g.tubes[s][g.tubes[s].length-1];let n=0,k=g.tubes[s].length-1;
while(k>=0&&g.tubes[s][k]===col&&(g.tubes[d].length+n)<CAP){n++;k--;}
S.busy=1;S.sel=null;const t=document.getElementById('tb'+s);if(t)t.classList.remove('sel');
animPour(s,d,n,col,()=>{const r=g.act(s,d);
S.flash=r&&r.sealed!==null?r.sealed:null;if(S.flash!==null)SFX.claim();
S.busy=0;draw();setTimeout(()=>{S.flash=null;},760);
if(g.over){finish();return;} if(S.mode==='ai'&&g.turn===1)aiTurn();});}

function fuseMove(a,b){const g=S.g;S.busy=1;S.sel=null;
const r=g.act(a,b);S.flash=b;
if(r.sealed!==null)SFX.claim();else SFX.fuse(r.value);
S.busy=0;draw();setTimeout(()=>{S.flash=null;
if(g.over){finish();return;} if(S.mode==='ai'&&g.turn===1)aiTurn();},340);}

function aiTurn(){S.think=1;draw();
setTimeout(()=>{const g=S.g,rnd=mb32(Date.now()&0xffff);
const m=best(g,S.ai.d,S.ai.b,rnd);S.think=0;
if(!m){draw();if(g.over)finish();return;}
g.kind==='fuse'?fuseMove(m[0],m[1]):pourMove(m[0],m[1]);},380+Math.random()*340);}

function finish(){const g=S.g,l=g.leader,s=S.st;
if(S.mode==='ai'){const K=g.kind;
if(l===0){if(K==='pour')s.w++;else if(K==='split')s.sw++;else if(K==='fuse')s.fw++;else s.rw++;
s.streak++;s.bs=Math.max(s.bs,s.streak);SFX.win();}
else{if(K==='pour')s.l++;else if(K==='split')s.sl++;else if(K==='fuse')s.fl++;else s.rl++;
s.streak=0;SFX.lose();}
s.best=Math.max(s.best,g.scores[0]);}
else{s.pp++;SFX.win();}
if(S.match){const m=S.match;m.res[m.g-1]=l;if(l===0)m.a++;else if(l===1)m.b++;}
checkAchievements();
draw();celebrate(g,l);}

function animateCount(el,target){const t0=performance.now(),dur=600;
function step(t){const p=Math.min(1,(t-t0)/dur),e=1-(1-p)*(1-p);
el.textContent=Math.round(target*e);if(p<1)requestAnimationFrame(step);else el.textContent=target;}
requestAnimationFrame(step);}

if(l>=0){const idxs=[];for(let i=0;i<g.owner.length;i++)if(g.owner[i]===l)idxs.push(i);
idxs.forEach((i,k)=>setTimeout(()=>{const el=document.getElementById('tb'+i);if(!el)return;
el.classList.add('winp');setTimeout(()=>el.classList.remove('winp'),480);},k*80));
const v0=document.getElementById('v0'),v1=document.getElementById('v1');
if(v0)animateCount(v0,g.scores[0]);if(v1)animateCount(v1,g.scores[1]);}
if(g.kind==='split'){const goldCol=g.own*2;
const gi=g.tubes.findIndex((t,i)=>g.sealed[i]&&t.length&&t[0]===goldCol);
if(gi>=0)setTimeout(()=>{const el=document.getElementById('tb'+gi);
if(el){el.classList.add('gold');setTimeout(()=>el.classList.remove('gold'),950);}},240);}}

function tap(i){const g=S.g;
if(g.over||S.busy||S.think)return;
if(S.mode==='ai'&&g.turn!==0)return;
if(S.sel===null){
const empty=g.kind==='fuse'?!g.grid[i]:!g.tubes[i].length;
if(empty||g.sealed[i])return;
if(!g.targets(i).length){shake(i);SFX.bad();return;}
S.sel=i;SFX.pick();draw();return;}
if(S.sel===i){S.sel=null;draw();return;}
if(g.canAct(S.sel,i)){g.kind==='fuse'?fuseMove(S.sel,i):pourMove(S.sel,i);return;}
shake(S.sel);SFX.bad();
const empty=g.kind==='fuse'?!g.grid[i]:!g.tubes[i].length;
if(!empty&&!g.sealed[i]&&g.targets(i).length){S.sel=i;SFX.pick();draw();}}

border-radius:${(w*.16)|0}px ${(w*.16)|0}px ${(w*.4)|0}px ${(w*.4)|0}px">${L.join('')}</div>

H(`${scrOpen()}<div class="wm"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="hd"><button class="ib" data-go="levels">‹</button><h2>${g.lv?`Level ${g.lv}`:'Solo sort'}</h2>

if(!g.done&&g.t0)setTimeout(()=>{if(S.sc==='solo'&&!S.so.done)drawSolo();},1000);}
function tapSolo(i){const g=S.so;if(g.done)return;
if(g.sel===null){if(!g.t[i].length)return;g.sel=i;SFX.pick();drawSolo();return;}
if(g.sel===i){g.sel=null;drawSolo();return;}
if(!sLegal(g.t,g.sel,i)){const e=document.getElementById('tb'+g.sel);
if(e){e.classList.add('shk');setTimeout(()=>e.classList.remove('shk'),310);}SFX.bad();return;}
if(!g.t0)g.t0=Date.now();
g.un.push(g.t.map(x=>x.slice()));
const col=g.t[g.sel][g.t[g.sel].length-1];let k=0;
while(g.t[g.sel].length&&g.t[g.sel][g.t[g.sel].length-1]===col&&g.t[i].length<CAP){g.t[i].push(g.t[g.sel].pop());k++;}
g.mv++;const src=g.sel;g.sel=null;
animPour(src,i,k,col,()=>{if(g.t.every(x=>!x.length||uni(x))){g.done=1;SFX.win();
if(g.lv)S.solved.add(g.lv);if(g.daily)completeDaily();checkAchievements();}
else if(uni(g.t[i]))SFX.claim();drawSolo();});}

/* ================= ROUTER ================= */
app.addEventListener('click',e=>{
const el=e.target.closest('[data-go],[data-t],[data-s],[data-start],[data-fmt],[data-bo],[data-pal],[data-buy],[data-again],[data-sn],[data-un],[data-next],[data-fr],[data-lv],[data-restart]');
if(!el)return;ac();const d=el.dataset;
if(d.go){const v=d.go;
if(v==='mute'){S.mute=!S.mute;MUTE=!!S.mute;saveState();menu();return;}
if(v==='daily'){PENDING_ANIM='fwd';startDaily();return;}
if(v==='ach'){S.sc='ach';PENDING_ANIM='fwd';achievements();return;}
if(v==='menu'){S.sc='menu';PENDING_ANIM='back';menu();return;}
if(v==='ai-pour'){S.sc='set';PENDING_ANIM='fwd';setup('pour');return;}
if(v==='ai-split'){S.sc='set';PENDING_ANIM='fwd';setup('split');return;}
if(v==='pass-split'){PENDING_ANIM='fwd';start('split',null);return;}
if(v==='ai-fuse'){S.sc='set';PENDING_ANIM='fwd';setup('fuse');return;}
if(v==='ai-recipe'){S.sc='set';PENDING_ANIM='fwd';setup('recipe');return;}
if(v==='pass-pour'){PENDING_ANIM='fwd';start('pour',null);return;}
if(v==='pass-fuse'){PENDING_ANIM='fwd';start('fuse',null);return;}
if(v==='pass-recipe'){PENDING_ANIM='fwd';start('recipe',null);return;}
if(v==='solo'){PENDING_ANIM='fwd';levels();return;}
if(v==='levels'){PENDING_ANIM='back';levels();return;}
if(v==='shuffle'){PENDING_ANIM='fwd';startSolo(6);return;}
if(v==='shop'){S.sc='shop';PENDING_ANIM='fwd';shop();return;}
if(v==='stats'){S.sc='stats';PENDING_ANIM='fwd';stats();return;}
if(v==='how'){S.sc='how';PENDING_ANIM='fwd';how();return;}}
if(d.start){const[k,a]=d.start.split(':');PENDING_ANIM='fwd';start(k,a);return;}
if(d.fmt){S.fmt=d.fmt;setup('pour');return;}
if(d.bo){if(d.bo==='5'&&!S.pro){toast('Unlock Pro for Best of 5');return;}
S.bo=+d.bo;saveState();setup(S.setupKind);return;}
if(d.t!==undefined){tap(+d.t);return;}
if(d.s!==undefined){tapSolo(+d.s);return;}
if(d.lv){PENDING_ANIM='fwd';startSoloLv(+d.lv);return;}
if(d.restart){const g=S.so;g.lv?startSoloLv(g.lv):startSolo(g.c);return;}
if(d.sn){startSolo(+d.sn);return;}
if(d.un){const g=S.so;if(g.un.length){g.t=g.un.pop();g.mv=Math.max(0,g.mv-1);g.sel=null;drawSolo();}return;}
if(d.pal){const p=PAL.find(x=>x.id===d.pal);
if(p.pro&&!S.pro){toast('Unlock Pro to use this palette');return;}
S.pal=d.pal;saveState();shop();return;}
if(d.buy){S.pro=1;SFX.claim();toast('Pro unlocked');saveState();shop();return;}
if(d.next){matchNext();return;}
if(d.again){start(S.kind,S.aiKey);return;}
if(d.fr){const ov=document.getElementById('frov');
if(d.fr==='skip'){if(ov)ov.remove();return;}
if(d.fr==='next'){if(FR_STEP>=FR_STEPS.length-1){if(ov)ov.remove();return;}
FR_STEP++;if(ov)ov.remove();showFirstRun();return;}}});
window.addEventListener('resize',()=>{if(S.sc==='game')draw();else if(S.sc==='solo')drawSolo();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{
if(S.sc==='game')draw();else if(S.sc==='solo')drawSolo();},260));

// iOS: WebAudio starts suspended and only resumes inside a real user gesture.
// One silent buffer on the first touch unlocks it for the session.
let AUDIO_UNLOCKED=false;
function unlockAudio(){if(AUDIO_UNLOCKED)return;
try{const c=ac();const b=c.createBuffer(1,1,22050);const src=c.createBufferSource();
src.buffer=b;src.connect(c.destination);src.start(0);AUDIO_UNLOCKED=true;}catch(e){}}
document.addEventListener('touchstart',unlockAudio,{once:true,passive:true});
document.addEventListener('mousedown',unlockAudio,{once:true});

// iOS Safari fires a synthetic 300ms click and zooms on double-tap. Neither is
// wanted in a tap-heavy game.
let lastTap=0;
document.addEventListener('touchend',e=>{
const now=Date.now();
if(now-lastTap<320){e.preventDefault();}
lastTap=now;},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
// Block rubber-band drag outside scrollable panes.
document.addEventListener('touchmove',e=>{
if(!e.target.closest('.pad'))e.preventDefault();},{passive:false});

/* ================= FIRST RUN (in-memory, once per session) ================= */
let FIRSTRUN_DONE=false,FR_STEP=0;
const FR_STEPS=[
{t:'One board',s:'Every move you make changes what your opponent can do next. You share a single board.'},
{t:'Claim to seal',s:'Fill a tube — or hit the merge target — and it seals. Claimed for good, nobody can touch it again.'},
{t:'Claiming keeps your turn',s:'Seal a tube in Pour or Split and you go again. Chain claims together to swing the game.'}];
function showFirstRun(){const st=FR_STEPS[FR_STEP],last=FR_STEP===FR_STEPS.length-1;
const dots=FR_STEPS.map((_,i)=>`<i style="width:6px;height:6px;border-radius:50%;display:inline-block;background:${i===FR_STEP?'var(--p1)':'var(--edge)'}"></i>`).join(' ');
app.insertAdjacentHTML('beforeend',`<div class="frov" id="frov"><div class="frcard">
<div style="margin-bottom:14px">${dots}</div>
<h3 style="font-size:19px;font-weight:900;margin-bottom:8px">${E(st.t)}</h3>
<div style="font-size:13.5px;color:var(--mute);line-height:1.6">${E(st.s)}</div>
<div style="display:flex;gap:9px;margin-top:20px">
<button data-fr="skip" style="flex:1;padding:12px;border-radius:11px;border:1px solid var(--edge);background:transparent;color:var(--mute);font-weight:700;font-size:14px;cursor:pointer">Skip</button>
<button data-fr="next" style="flex:1;padding:12px;border-radius:11px;border:0;background:var(--p1);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer">${last?'Start':'Next'}</button>
</div></div></div>`);}
function maybeFirstRun(){if(FIRSTRUN_DONE)return;FIRSTRUN_DONE=true;FR_STEP=0;showFirstRun();}

loadState();
menu();maybeFirstRun();
</script></body></html>
