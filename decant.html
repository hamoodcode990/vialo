<title>VIALO</title><style>
:root{--ink:#F5F3FF;--ink2:#FFFFFF;--glass:#FFFFFF;--edge:rgba(28,27,45,.08);
--txt:#1C1B24;--mute:#83809A;
--p1:#00C389;--p1d:#009A6C;--p2:#FF4D74;--p2d:#E22F58;
--violet:#7B5CFA;--violetd:#5F3FE0;--gold:#FFB020;--goldd:#E8930A;--hot:#FF4438;
--life:#FF4D74;--coin:#FFB020;
--shadow-sm:0 2px 10px -4px rgba(28,27,50,.1);
--shadow-md:0 14px 30px -12px rgba(28,27,50,.2);
--shadow-lg:0 24px 52px -18px rgba(28,27,50,.26);
--bevel:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 4px rgba(28,27,50,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:var(--ink);color:var(--txt);
overscroll-behavior:none;user-select:none;-webkit-user-select:none;
-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
position:fixed;width:100%;overflow:hidden;
font-family:-apple-system,"SF Pro Display","Segoe UI",ui-sans-serif,Inter,system-ui,sans-serif}
#app{max-width:540px;margin:0 auto;height:100%;position:relative;overflow:hidden;
padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#app.bg-rose .wm{filter:hue-rotate(-25deg) saturate(1.15)}
#app.bg-verdant .wm{filter:hue-rotate(70deg) saturate(1.1)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scr.fwd{animation:scrFwd .3s cubic-bezier(.25,.9,.3,1) both}
.scr.back{animation:scrBack .3s cubic-bezier(.25,.9,.3,1) both}
@keyframes scrFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- brand ---- */
.wm{position:absolute;inset:0;pointer-events:none;background-size:180% 180%;
animation:wmshift 16s ease-in-out infinite alternate;
background-image:
radial-gradient(1100px 680px at 12% -12%,rgba(0,195,137,.08),transparent 60%),
radial-gradient(900px 620px at 102% 106%,rgba(255,77,116,.07),transparent 60%),
radial-gradient(680px 480px at 92% 8%,rgba(123,92,250,.06),transparent 55%),
radial-gradient(760px 520px at 6% 96%,rgba(255,176,32,.05),transparent 55%)}
@keyframes wmshift{0%{background-position:0% 20%}100%{background-position:100% 80%}}
.brand{text-align:center;padding:4px 0 2px}
.logo{display:flex;justify-content:center;gap:9px;padding-top:2px}
.ld{width:11px;height:15px;border-radius:50% 50% 50% 0;opacity:0;
animation:ldfall .62s cubic-bezier(.3,.85,.4,1.1) both;animation-delay:calc(var(--i)*100ms)}
@keyframes ldfall{0%{transform:rotate(45deg) translateY(-42px) scale(.6);opacity:0}
55%{transform:rotate(45deg) translateY(5px) scale(1.18);opacity:1}
78%{transform:rotate(45deg) translateY(-3px) scale(.95)}
100%{transform:rotate(45deg) translateY(0) scale(1);opacity:1}}
.brand h1{font-size:38px;font-weight:800;letter-spacing:-1.4px;color:var(--txt)}
.brand .sb{font-size:9.5px;letter-spacing:3.6px;color:var(--mute);margin-top:6px;font-weight:600}

/* ---- condensed menu tiles ---- */
.mtiles{margin-top:20px}
.mtile{position:relative;background:linear-gradient(180deg,#fff,#fdfdff);
border:1px solid var(--edge);border-radius:20px;padding:13px 18px 13px 20px;margin-bottom:11px;cursor:pointer;
box-shadow:var(--shadow-sm),var(--bevel);opacity:0;animation:mtRise .45s cubic-bezier(.22,1,.36,1) both;
transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s cubic-bezier(.22,1,.36,1)}
.mtile:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;
background:linear-gradient(180deg,var(--mc),color-mix(in srgb,var(--mc) 65%,#000))}
.mtile.big{padding:18px 20px 18px 22px}
.mtile.big .mt-n{font-size:25px}
.mtile.big .mt-s{font-size:12.5px}
.mtile:nth-of-type(1){animation-delay:.06s}.mtile:nth-of-type(2){animation-delay:.13s}.mtile:nth-of-type(3){animation-delay:.2s}
@keyframes mtRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mtile:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.mtile:active{transform:translateY(-1px) scale(.986);box-shadow:var(--shadow-sm)}
.mt-h{display:flex;align-items:center;justify-content:space-between}
.mt-n{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--txt)}
.mt-s{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.45;padding-right:6px}
.mt-pp{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;font-weight:700;color:#fff;
padding:6px 12px;border-radius:20px;background:linear-gradient(135deg,var(--mc),color-mix(in srgb,var(--mc) 70%,#000));
box-shadow:0 4px 10px -4px color-mix(in srgb,var(--mc) 60%,transparent)}
.msolo{background:linear-gradient(180deg,#fff,#fdfdff);
border:1px solid var(--edge);border-radius:16px;padding:14px 18px;margin-top:2px;margin-bottom:16px;
display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:14px;
box-shadow:var(--shadow-sm);opacity:0;animation:mtRise .45s cubic-bezier(.22,1,.36,1) .28s both;
transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1)}
.msolo:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.msolo .cv{color:var(--mute);font-size:17px}
.mutil{display:flex;justify-content:center;gap:12px;margin-bottom:8px;
opacity:0;animation:mtRise .45s cubic-bezier(.22,1,.36,1) .34s both}
.micon{position:relative;width:46px;height:46px;border-radius:50%;
background:linear-gradient(180deg,#fff,#fdfdff);border:1px solid var(--edge);
display:flex;align-items:center;justify-content:center;font-size:17px;
cursor:pointer;color:var(--txt);box-shadow:var(--shadow-sm);
transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1)}
.micon:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.micon:active{transform:scale(.92)}
.micon .dot{position:absolute;top:1px;right:2px;width:8px;height:8px;border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--goldd));box-shadow:0 0 0 2px var(--ink)}
.mrec{text-align:center;font-size:12px;color:var(--mute);margin-top:12px;font-variant-numeric:tabular-nums}
.daily{background:linear-gradient(140deg,#fffaf1,#fff);border:1px solid rgba(212,162,76,.28);
border-radius:16px;padding:14px 18px;margin-top:18px;margin-bottom:2px;cursor:pointer;
box-shadow:var(--shadow-sm);transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s cubic-bezier(.22,1,.36,1)}
.daily:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.daily:active{transform:translateY(0) scale(.99)}
.daily-h{display:flex;justify-content:space-between;align-items:center}
.daily-t{font-size:16px;font-weight:800;letter-spacing:-.2px;color:var(--goldd)}
.daily-fl{font-size:13px;font-weight:700;color:var(--goldd);font-variant-numeric:tabular-nums}
.daily-s{font-size:11.5px;color:var(--mute);margin-top:3px}
.ach{background:var(--ink2);border:1px solid var(--edge);border-radius:14px;padding:13px;margin-bottom:9px;
display:flex;align-items:center;gap:12px;opacity:.5;box-shadow:var(--shadow-sm)}
.ach.on{opacity:1;border-color:rgba(212,162,76,.35);box-shadow:var(--shadow-md)}
.ach-i{font-size:20px;width:36px;text-align:center;flex-shrink:0}
.ach-n{font-size:14.5px;font-weight:800}
.ach-s{font-size:11.5px;color:var(--mute);margin-top:2px}

/* ---- glass tube (the signature) ---- */
.tube{position:relative;cursor:pointer;
transition:transform .22s cubic-bezier(.3,1.15,.4,1),filter .22s}
.glass{position:relative;overflow:hidden;background:linear-gradient(105deg,
rgba(255,255,255,.55),rgba(255,255,255,.18) 32%,rgba(28,27,50,.035) 70%,rgba(28,27,50,.06));
border:1.5px solid rgba(255,255,255,.65);border-top-left-radius:9px;border-top-right-radius:9px;
box-shadow:inset 0 0 0 1px rgba(28,27,50,.05),
inset 0 12px 20px -12px rgba(255,255,255,.7),inset 0 -16px 22px -14px rgba(28,27,50,.12),
0 14px 20px -12px rgba(28,27,50,.16)}
.glass:after{content:'';position:absolute;left:13%;top:4%;width:10%;height:84%;border-radius:50%;
background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none;z-index:5}
.glass:before{content:'';position:absolute;right:10%;top:10%;width:5%;height:60%;border-radius:50%;
background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none;z-index:5}
.liq{position:absolute;left:0;right:0;transition:bottom .2s cubic-bezier(.3,1.3,.5,1),height .2s;
box-shadow:inset 0 -3px 7px -2px rgba(0,0,0,.42)}
.liq.top{border-top-left-radius:46% 9px;border-top-right-radius:46% 9px;overflow:hidden}
.liq.top:before{content:'';position:absolute;top:-3px;left:0;right:0;height:6px;border-radius:50%;
background:rgba(255,255,255,.22)}
.liq.top:after{content:'';position:absolute;top:0;bottom:0;left:-45%;width:45%;pointer-events:none;
background:linear-gradient(115deg,transparent,rgba(255,255,255,.025),transparent);
animation:shim 6s ease-in-out infinite}
@keyframes shim{0%{transform:translateX(0)}100%{transform:translateX(320%)}}
.liq.wob{animation:wob .42s cubic-bezier(.3,1.4,.5,1)}
@keyframes wob{0%{transform:scaleY(.82)}55%{transform:scaleY(1.07)}100%{transform:scaleY(1)}}
.tube.sel{transform:translateY(-15px) scale(1.04)}
.tube.sel .glass{border-color:var(--p1);border-width:2px}
.tube.tgt .glass{border-color:var(--p1)}
.tube.tgt:before{content:'';position:absolute;inset:-5px;border-radius:11px;
border:1px dashed var(--p1);animation:rot 9s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
.tube.dim{opacity:.34;filter:saturate(.4)}

  return Math.abs(ax-bx)+Math.abs(ay-by)===1;}
  canAct(a,b){if(a===b||this.sealed[a]||this.sealed[b])return false;
  if(!this.grid[a]||!this.grid[b])return false;if(!this.adj(a,b))return false;
  return this.grid[a]===this.grid[b];}
  targets(a){const o=[];for(let b=0;b<this.grid.length;b++)if(this.canAct(a,b))o.push(b);return o;}
  moves(){const o=[];for(let a=0;a<this.grid.length;a++)for(let b=0;b<this.grid.length;b++)
  if(this.canAct(a,b))o.push([a,b]);return o;}
  get claimed(){return this.scores[0]+this.scores[1];}
  get over(){return !this.moves().length;}
  get leader(){ // komi: P2 wins ties
  return this.scores[0]>this.scores[1]?0:1;}
  act(a,b){if(this.over||!this.canAct(a,b))return null;
  const v=this.grid[b]+1;this.grid[b]=v;this.grid[a]=0;let sl=null;
  if(v>=this.target){this.sealed[b]=true;this.owner[b]=this.turn;this.scores[this.turn]++;sl=b;}
  const who=this.turn;this.turn=1-this.turn; // no keep-turn: it made P1 win 82%
  this.history.push([a,b,v,sl,who]);
  return{from:a,to:b,value:v,sealed:sl,by:who};}
}

c.sealed=f.sealed.slice();c.owner=f.owner.slice();c.scores=f.scores.slice();c.turn=f.turn;
c.history=[];c.komi=true;return c;}

class Split{ // SPLIT: 3 colours each + 1 neutral. Everything completes, so the
             // neutral decides every game: 4-3.
  constructor(seed,c,e,own){this.kind='split';this.seed=seed;this.colors=c;this.own=own;
  this.tubes=genTubes(seed,c,e);
  this.sealed=new Array(this.tubes.length).fill(false);this.owner=new Array(this.tubes.length).fill(-1);
  this.scores=[0,0];this.turn=0;this.history=[];this.last=null;this.stall=0;this.komi=false;}
  colOwner(col){if(col<this.own)return 0;if(col<this.own*2)return 1;return -1;}
  canAct(s,d){if(s===d||this.sealed[s])return false;
  if(this.last&&this.last[0]===d&&this.last[1]===s)return false;
  const A=this.tubes[s],B=this.tubes[d];if(!A.length||B.length>=CAP)return false;
  return !B.length||A[A.length-1]===B[B.length-1];}
  targets(s){const o=[];for(let d=0;d<this.tubes.length;d++)if(this.canAct(s,d))o.push(d);return o;}
  moves(){const o=[];for(let s=0;s<this.tubes.length;s++)for(let d=0;d<this.tubes.length;d++)
  if(this.canAct(s,d))o.push([s,d]);return o;}
  get claimed(){return this.scores[0]+this.scores[1];}
  get left(){return Math.max(0,STALL-this.stall);}
  get over(){return this.claimed>=this.colors||this.stall>=STALL||!this.moves().length;}
  get leader(){return this.scores[0]===this.scores[1]?-1:(this.scores[0]>this.scores[1]?0:1);}
  act(s,d){if(this.over||!this.canAct(s,d))return null;
  const col=this.tubes[s][this.tubes[s].length-1];let n=0;
  while(this.tubes[s].length&&this.tubes[s][this.tubes[s].length-1]===col&&this.tubes[d].length<CAP){
  this.tubes[d].push(this.tubes[s].pop());n++;}
  let sl=null;
  for(let i=0;i<this.tubes.length;i++)if(!this.sealed[i]&&uni(this.tubes[i])){
  let o=this.colOwner(this.tubes[i][0]); if(o===-1)o=this.turn;   // neutral goes to the pourer
  this.sealed[i]=true;this.owner[i]=o;this.scores[o]++;sl=i;}
  const who=this.turn;this.last=sl===null?[s,d]:null;this.stall=sl===null?this.stall+1:0;
  this.turn=1-this.turn;   // no chaining here - the neutral race is the tension
  this.history.push([s,d,n,sl,who]);
  return{from:s,to:d,n,col,sealed:sl,by:who};}
}
function cloneSplit(p){const c=Object.create(Split.prototype);
c.kind='split';c.seed=p.seed;c.colors=p.colors;c.own=p.own;c.tubes=p.tubes.map(t=>t.slice());
c.sealed=p.sealed.slice();c.owner=p.owner.slice();c.scores=p.scores.slice();c.turn=p.turn;
c.history=[];c.last=p.last?p.last.slice():null;c.stall=p.stall;c.komi=false;return c;}

function shuffleN(n,k,rnd){const a=[...Array(n).keys()];
for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
return a.slice(0,k);}

const RC_SRC=10,RC_COL=8; // 10 shared source tubes, 8 colours, each recipe is CAP(4) long.
// (was 8 tubes / 6 colours: measured 500-game sim at that size was a 62/38
// skew toward whoever moves first — 6 colours gave the two 4-long formulas
// too much forced overlap, so first pick off the shared tubes usually
// decided it. At 8 colours/10 tubes the same sim comes out ~247/253 and
// ~232/268 depending who starts — close enough, combined with per-match
// starter alternation, to call this fixed rather than merely improved.)
class Recipe{ // RECIPE: each player secretly races to build their own exact colour
              // sequence (own vial = tubes[RC_SRC+turn]) from the shared source tubes.
              // No chaining, no take-backs on the vials — a wrong-order pour is simply
              // illegal, so the tension is entirely in setting up the right top colour
              // before your opponent claims it for their own build.
              // Balance history: at 6 colours/8 tubes this was a 62/38 skew toward
              // whoever moved first (500-game sim, depth-1 AI, 10% blunder). Tried and
              // rejected: a bonus move for the responder (overshot to ~55-60% in their
              // favour), a formula-length handicap (same overshoot), delaying the
              // starter's first fill by 1-3 plies (overshot even harder — being able to
              // fill on move 1 turned out to matter far more than raw move count).
              // What actually worked: more colours relative to formula length (8 colours
              // instead of 6, same CAP-4 formula) — same sim now lands at ~247/253 and
              // ~232/268 depending who starts. ~9% of games now resolve via the shared
              // stall clock instead of a clean finish (up from 0%); those go through the
              // same komi as a tie. Combined with per-match starter alternation, this is
              // close enough to call fixed rather than merely improved.
  constructor(seed){this.kind='recipe';this.seed=seed;this.colors=RC_COL;
  this.tubes=genTubes(seed,RC_COL,2);
  this.tubes.push([],[]); // RC_SRC, RC_SRC+1 = player 0 / player 1 vials
  const rnd=mb32((seed*2654435761)>>>0);
  this.recipes=[shuffleN(RC_COL,CAP,rnd),shuffleN(RC_COL,CAP,rnd)];
  this.sealed=new Array(this.tubes.length).fill(false);this.owner=new Array(this.tubes.length).fill(-1);
  this.scores=[0,0];this.turn=0;this.history=[];this.stall=0;this.komi=true;}
  canAct(s,d){if(s===d||s>=RC_SRC)return false;
  const A=this.tubes[s];if(!A.length)return false;
  if(d>=RC_SRC){const p=d-RC_SRC;if(p!==this.turn)return false;
  const B=this.tubes[d];return B.length<CAP&&A[A.length-1]===this.recipes[p][B.length];}
  const B=this.tubes[d];if(B.length>=CAP)return false;
  return !B.length||A[A.length-1]===B[B.length-1];}
  targets(s){const o=[];for(let d=0;d<this.tubes.length;d++)if(this.canAct(s,d))o.push(d);return o;}
  moves(){const o=[];for(let s=0;s<this.tubes.length;s++)for(let d=0;d<this.tubes.length;d++)
  if(this.canAct(s,d))o.push([s,d]);return o;}
  get claimed(){return this.scores[0]+this.scores[1];}
  get left(){return Math.max(0,STALL-this.stall);}
  get over(){return this.scores[0]>=CAP||this.scores[1]>=CAP||this.stall>=STALL||!this.moves().length;}
  get leader(){if(this.scores[0]>=CAP)return 0;if(this.scores[1]>=CAP)return 1;
  return this.scores[0]===this.scores[1]?1:(this.scores[0]>this.scores[1]?0:1);} // komi: P2 wins ties/incomplete
  act(s,d){if(this.over||!this.canAct(s,d))return null;
  const isVial=d>=RC_SRC,col=this.tubes[s][this.tubes[s].length-1];let n=0,sl=null;
  if(isVial){const p=d-RC_SRC;this.tubes[d].push(this.tubes[s].pop());n=1;this.scores[p]++;this.stall=0;
  if(this.tubes[d].length>=CAP){this.sealed[d]=true;this.owner[d]=p;sl=d;}}
  else{while(this.tubes[s].length&&this.tubes[s][this.tubes[s].length-1]===col&&this.tubes[d].length<CAP){
  this.tubes[d].push(this.tubes[s].pop());n++;}this.stall++;}
  const who=this.turn;this.turn=1-this.turn;
  this.history.push([s,d,n,sl,who]);
  return{from:s,to:d,n,col,sealed:sl,by:who};}
}
function cloneRecipe(r){const c=Object.create(Recipe.prototype);
c.kind='recipe';c.seed=r.seed;c.colors=r.colors;c.tubes=r.tubes.map(t=>t.slice());
c.recipes=r.recipes.map(t=>t.slice());
c.sealed=r.sealed.slice();c.owner=r.owner.slice();c.scores=r.scores.slice();c.turn=r.turn;
c.history=[];c.stall=r.stall;c.komi=true;return c;}

const clone=g=>g.kind==='pour'?clonePour(g):g.kind==='split'?cloneSplit(g):g.kind==='fuse'?cloneFuse(g):cloneRecipe(g);
function evalG(g,me){return (g.scores[me]-g.scores[1-me])*100;}
function best(g,depth,blunder,rnd){
const mv=g.moves();if(!mv.length)return null;
if(rnd()<blunder)return mv[Math.floor(rnd()*mv.length)];
const me=g.turn;let b=null,bs=-Infinity;
for(const[s,d]of mv){const c=clone(g);c.act(s,d);
let sc=evalG(c,me)+(c.kind==='fuse'?(c.grid[d]||0):0);
if(depth>1&&!c.over){const r=best(c,depth-1,0,rnd);
if(r){const c2=clone(c);c2.act(r[0],r[1]);sc=evalG(c2,me)+(c2.kind==='fuse'?(c2.grid[r[1]]||0):0);}}
sc+=(rnd()-.5)*.01;if(sc>bs){bs=sc;b=[s,d];}}
return b;}

/* ================= GAME ================= */
function start(kind,aiKey){
S.levelRun=null;S.kind=kind;S.match={a:0,b:0,g:1,first:0,res:[],bo:S.bo};
S.mode=aiKey?'ai':'pass'; S.ai=aiKey?AI[aiKey]:null; S.aiKey=aiKey;
S.names=aiKey?['You',AI[aiKey].n+' bot']:['Player 1','Player 2'];
newGame(0);}

// best-of-N: newGame keeps the match tally, start() begins a fresh one
function newGame(first){
const f=FMT[S.fmt];
const sd=(Date.now()%9e5)+((Math.random()*999)|0);
S.g = S.kind==='pour' ? new Pour(sd,f.c,f.e)
    : S.kind==='split'? new Split(sd,7,3,3)
    : S.kind==='fuse'? new Fuse(sd)
    : new Recipe(sd);
if(first)S.g.turn=1;
if(S.match)S.match.first=first;
S.sel=null;S.busy=0;S.flash=null;S.think=0;S.finished=0;S.sc='game';draw();
if(S.g.turn===1&&S.mode==='ai')aiTurn();}

function matchNext(){if(!S.match)return;
const nf=1-S.match.first;S.match.g++;newGame(nf);}

// A duel ladder "level" is a single deterministic game, no best-of-N wrapper —
// mirrors the "one puzzle, one attempt" pacing of the Solo ladder.
function startLevelDuel(kind,n){
if(n>S.levelProgress[kind]){toast('Locked — clear the level before it first');return;}
if(S.lives<=0&&!livesUnlimited()){S.sc='store';PENDING_ANIM='fwd';store();toast('Out of lives');return;}
const cfg = kind==='pour'?pourLvlCfg(n):kind==='split'?splitLvlCfg(n):kind==='fuse'?fuseLvlCfg(n):recipeLvlCfg(n);
S.levelRun={kind,n,aiKey:cfg.ai};S.kind=kind;S.match=null;
S.mode='ai';S.ai=AI[cfg.ai];S.aiKey=cfg.ai;S.names=['You',AI[cfg.ai].n+' bot'];
const sd=modeSeed(kind,n);
S.g = kind==='pour' ? new Pour(sd,cfg.c,cfg.e)
    : kind==='split'? new Split(sd,cfg.c,cfg.e,cfg.own)
    : kind==='fuse'? new Fuse(sd)
    : new Recipe(sd);
S.sel=null;S.busy=0;S.flash=null;S.think=0;S.finished=0;S.sc='game';draw();
if(S.g.turn===1&&S.mode==='ai')aiTurn();}

function tubesHTML(){const g=S.g,c=cs(),n=g.tubes.length,w=tW(n),
uh=Math.max(20,Math.round(w*1.05)),H4=uh*CAP;

const sel=S.sel===i,tgt=S.sel!==null&&g.canAct(S.sel,i),dim=S.sel!==null&&!sel&&!tgt;
const cl=['tube',g.sealed[i]?'done':'',sel?'sel':'',tgt?'tgt':'',dim?'dim':'',S.flash===i?'flash':''].filter(Boolean).join(' ');

return `<div class="${cl}" data-t="${i}" id="tb${i}">
<div class="glass" id="gl${i}" style="width:${w}px;height:${H4}px;border-radius:${Math.round(w*.16)}px ${Math.round(w*.16)}px ${Math.round(w*.4)}px ${Math.round(w*.4)}px">

// In SPLIT every colour belongs to someone. Show it under the tube so you can
// read the board at a glance instead of memorising which colours are yours.
function capText(g,t,i){
if(g.kind==='recipe'){return i>=RC_SRC?(i-RC_SRC===0?'YOUR VIAL':'THEIR VIAL'):'';}
if(g.kind!=='split'){return g.sealed[i]?'●':'';}
if(!t.length)return '';
const o=g.colOwner(t[t.length-1]);
return o===0?'YOU':o===1?'THEM':'GOLD';}
function capStyle(g,t,i){
if(g.kind==='recipe')return i>=RC_SRC?'color:'+(i-RC_SRC===0?'var(--p1)':'var(--p2)'):'';
if(!t.length)return '';
const o=g.colOwner(t[t.length-1]);
return 'color:'+(o===0?'var(--p1)':o===1?'var(--p2)':'var(--gold)');}
function ownerColor(g,t,i){
if(g.kind==='recipe')return i>=RC_SRC?(i-RC_SRC===0?'var(--p1)':'var(--p2)'):'transparent';
if(!t.length)return 'transparent';
const o=g.colOwner(t[t.length-1]);
return o===0?'var(--p1)':o===1?'var(--p2)':'var(--gold)';}

function shade(hex,p){const n=parseInt(hex.slice(1),16);
let r=(n>>16)+p,gg=((n>>8)&255)+p,b=(n&255)+p;
const cl=x=>Math.max(0,Math.min(255,x));
return '#'+((1<<24)+(cl(r)<<16)+(cl(gg)<<8)+cl(b)).toString(16).slice(1);}

/* ---- liquid pour animation ---- */
function animPour(s,d,n,col,done){
const c=cs(),a=document.getElementById('gl'+s),b=document.getElementById('gl'+d);
if(!a||!b){done();return;}
const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),pr=app.getBoundingClientRect();
const w=Math.max(7,Math.round(ar.width*.3));
const sx=ar.left-pr.left+ar.width/2-w/2, sy=ar.top-pr.top+4;
const ex=br.left-pr.left+br.width/2-w/2, ey=br.top-pr.top+8;
let fin=0;
for(let i=0;i<n;i++)setTimeout(()=>{
const el=document.createElement('div');el.className='drop';
el.style.cssText=`width:${w}px;height:${Math.round(w*1.25)}px;left:${sx}px;top:${sy}px;
background:linear-gradient(180deg,${c[col%c.length]},${shade(c[col%c.length],-24)});
transition:transform .3s cubic-bezier(.35,0,.25,1)`;
app.appendChild(el);SFX.drip(i);
requestAnimationFrame(()=>{el.style.transform=`translate(${ex-sx}px,${ey-sy-34}px) scaleY(1.3)`;
setTimeout(()=>{el.style.transition='transform .17s cubic-bezier(.4,1.5,.6,1)';
el.style.transform=`translate(${ex-sx}px,${ey-sy}px) scaleY(.8)`;
setTimeout(()=>{
const sp=document.createElement('div');sp.className='splash';
sp.style.cssText=`width:${w*1.6}px;height:${w*1.6}px;left:${ex-w*.3}px;top:${ey-w*.3}px;
border-color:${c[col%c.length]}`;app.appendChild(sp);setTimeout(()=>sp.remove(),450);
el.remove();SFX.splash();if(++fin===n)done();},175);},300);});},i*72);}

function pourMove(s,d){const g=S.g;
const col=g.tubes[s][g.tubes[s].length-1];let n=0,k=g.tubes[s].length-1;
while(k>=0&&g.tubes[s][k]===col&&(g.tubes[d].length+n)<CAP){n++;k--;}
S.busy=1;S.sel=null;const t=document.getElementById('tb'+s);if(t)t.classList.remove('sel');
animPour(s,d,n,col,()=>{const r=g.act(s,d);
S.flash=r&&r.sealed!==null?r.sealed:null;if(S.flash!==null)SFX.claim();
S.busy=0;draw();setTimeout(()=>{S.flash=null;},760);
if(g.over){finish();return;} if(S.mode==='ai'&&g.turn===1)aiTurn();});}

function fuseMove(a,b){const g=S.g;S.busy=1;S.sel=null;
const r=g.act(a,b);S.flash=b;
if(r.sealed!==null)SFX.claim();else SFX.fuse(r.value);
S.busy=0;draw();setTimeout(()=>{S.flash=null;
if(g.over){finish();return;} if(S.mode==='ai'&&g.turn===1)aiTurn();},340);}

function aiTurn(){S.think=1;draw();
setTimeout(()=>{const g=S.g,rnd=mb32(Date.now()&0xffff);
if(g!==S.g||g.over){S.think=0;if(g===S.g)draw();return;} // stale timer: game already ended/replaced
const m=best(g,S.ai.d,S.ai.b,rnd);S.think=0;
if(!m){draw();if(g.over)finish();return;}
g.kind==='fuse'?fuseMove(m[0],m[1]):pourMove(m[0],m[1]);},380+Math.random()*340);}

const BOT_BONUS={easy:25,normal:40,hard:60}; // "beating a bot" coin reward, any AI win — ladder or Quick Match
// finish() must be idempotent: a stray aiTurn()/pourMove callback that was already in flight
// when the game ended can still reach the "if(g.over)finish()" check afterward.
function finish(){if(S.finished)return;S.finished=1;
const g=S.g,l=g.leader,s=S.st,won=S.mode==='ai'&&l===0;
if(S.mode==='ai'){const K=g.kind;
if(l===0){if(K==='pour')s.w++;else if(K==='split')s.sw++;else if(K==='fuse')s.fw++;else s.rw++;
s.streak++;s.bs=Math.max(s.bs,s.streak);SFX.win();addCoins(BOT_BONUS[S.aiKey]||0);}
else{if(K==='pour')s.l++;else if(K==='split')s.sl++;else if(K==='fuse')s.fl++;else s.rl++;
s.streak=0;SFX.lose();}
s.best=Math.max(s.best,g.scores[0]);}
else{s.pp++;SFX.win();}
if(S.match){const m=S.match;m.res[m.g-1]=l;if(l===0)m.a++;else if(l===1)m.b++;}
if(S.levelRun){const{kind,n}=S.levelRun;
if(won){const st=duelStars(kind,g);
S.stars[kind][n]=Math.max(S.stars[kind][n]||0,st);
if(n===S.levelProgress[kind])S.levelProgress[kind]=Math.min(LV_N[kind],n+1);
const coins=10+5*st;addCoins(coins);S.levelRun.result={won:true,stars:st,coins};

/* ================= LEVEL LADDERS (shared across Solo + 4 duel modes) ================= */
// Every level's board is generated from modeSeed(modeId,n) — deterministic, so level 47
// is the same board for every player and 800+ levels cost no file size.
const LV_N={solo:300,pour:150,split:150,fuse:100,recipe:100};
function modeSeed(modeId,n){let h=0;const s=modeId+':'+n;
for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%900000;}
// Fuse and Recipe boards are CLAUDE.md-locked tuned constants (6x6/target-4, RC_SRC/RC_COL) —
// their ladder varies bot difficulty only. Pour/Split already take board size as constructor
// params (same mechanism the Standard/Blitz format toggle uses), so their ladder also grows
// the board. Split always keeps exactly one neutral colour (c=own*2+1).
const aiTier=t=>t<0.34?'easy':t<0.7?'normal':'hard';
function soloCfg(n){const t=(n-1)/(LV_N.solo-1);const c=Math.round(4+t*8);
return{c,e:Math.max(1,Math.round(3-t*2))};}
function pourLvlCfg(n){const t=(n-1)/(LV_N.pour-1);
return{c:Math.round(5+t*6),e:Math.max(2,Math.round(5-t*2)),ai:aiTier(t)};}
function splitLvlCfg(n){const t=(n-1)/(LV_N.split-1);const own=2+Math.round(t*3);
return{own,c:own*2+1,e:3,ai:aiTier(t)};}
function fuseLvlCfg(n){return{ai:aiTier((n-1)/(LV_N.fuse-1))};}
function recipeLvlCfg(n){return{ai:aiTier((n-1)/(LV_N.recipe-1))};}
// Star pacing is UX/heuristic, not a measured balance constant like CLAUDE.md's engine
// tuning — it never changes a rule or an outcome, only how the win is graded afterward.
function soloPar(c,e){return Math.round(c*2.3+(3-e));}
function soloStars(usedHint,mv,par){return usedHint?1:(mv<=par?3:2);}
function duelStars(kind,g){const margin=g.scores[0]-g.scores[1];
const scale=kind==='fuse'?6:kind==='recipe'?CAP:g.colors;
return margin>=Math.ceil(scale*0.4)?3:2;}
function starRow(n){let o='';for(let i=1;i<=3;i++)o+=`<i class="${i<=n?'on':''}">★</i>`;return `<div class="stars">${o}</div>`;}

function sLegal(t,s,d){if(s===d||!t[s].length||t[d].length>=CAP)return false;

for(let s=0;s<t.length;s++){if(!t[s].length)continue;

<div class="stt"><div class="v">${s.best}</div><div class="l">most claimed</div></div>
<div class="stt"><div class="v">${s.pp}</div><div class="l">pass &amp; play</div></div></div>
${(()=>{const games=s.w+s.l+s.sw+s.sl+s.fw+s.fl+s.rw+s.rl,wins=s.w+s.sw+s.fw+s.rw;
return `<div class="lbl">DETAILED</div><div style="display:flex;gap:9px;margin-bottom:9px">
<div class="stt"><div class="v">${games}</div><div class="l">games played</div></div>
<div class="stt"><div class="v">${games?Math.round(wins/games*100)+'%':'—'}</div><div class="l">overall rate</div></div></div>
<div style="display:flex;gap:9px">
<div class="stt"><div class="v">${Object.keys(S.stars.solo).length}/${LV_N.solo}</div><div class="l">levels solved</div></div>
<div class="stt"><div class="v">🔥 ${S.daily.streak}</div><div class="l">daily streak</div></div>
<div class="stt"><div class="v">${S.ach.size}/${ACHIEVEMENTS.length}</div><div class="l">achievements</div></div></div>`;})()}
<div class="tx" style="margin-top:16px">Stats are saved on this device — they'll be here next time
you open Vialo.</div></div></div>`);}
registerHeaderScreen('stats',stats);
function achievements(){S.sc='ach';H(`${scrOpen()}<div class="wm"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="hd"><button class="ib" data-go="menu">‹</button><h2>Achievements</h2></div>
<div class="pad">${headerBar()}<div class="lbl">${S.ach.size}/${ACHIEVEMENTS.length} UNLOCKED</div>
${ACHIEVEMENTS.map(a=>{const on=S.ach.has(a.id);
return `<div class="ach ${on?'on':''}"><div class="ach-i">${on?'🏆':'🔒'}</div>
<div style="flex:1"><div class="ach-n">${a.n}</div><div class="ach-s">${a.s}</div></div></div>`;}).join('')}
</div></div>`);}
registerHeaderScreen('ach',achievements);
function how(){S.sc='how';H(`${scrOpen()}<div class="wm"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="hd"><button class="ib" data-go="menu">‹</button><h2>How to play</h2></div>
<div class="pad">${headerBar()}<div class="tx">
<div class="r" style="margin-top:6px">You're an apprentice at Madame Corvel's atelier, the last house
in the quarter that still trains by hand. Every discipline she teaches comes down to the same
lesson, taught four different ways: <b>the board is shared, and every move you make changes what's
still possible for the other hand on it.</b></div>
<div class="lbl">EVERY MODE SHARES ONE IDEA</div>
<div class="r"><b>One board, two players.</b> You take turns on the same board. Every move you make
changes their options too — that is the whole game.</div>
<div class="r"><b>Claim to score.</b> A claimed piece <b>seals</b>: nobody can touch it again.
Sealing is what drives the board toward an ending.</div>
<div class="lbl">POUR</div>
<div class="r">Tap a tube to lift its top liquid, tap another to pour. Same colour only.
Fill a tube with one colour to claim it — and <b>you go again</b>. Chain two claims and you swing the game.</div>
<div class="r">Ends when every colour is claimed, no legal pour remains, or 24 moves pass with nobody claiming.
You also cannot immediately undo the move just played against you.</div>
<div class="lbl">SPLIT</div>
<div class="r">Same tubes, but the colours are divided: <b>three are yours, three are theirs,
and one is gold</b>. Every tube shows its owner underneath.</div>
<div class="r">A tube scores for <b>whoever owns that colour</b> — not whoever poured it. So an easy
pour can hand them a point. The gold tube goes to whoever completes it.</div>
<div class="r">Everything completes eventually, so it always finishes <b>4—3</b>. The gold colour
is the whole match. Bury it, race for it, or bait them into opening it for you.</div>
<div class="lbl">FUSE</div>
<div class="r">Tap two <b>adjacent tiles of equal value</b> to fuse them into one tile worth one more.
Reach <b>4</b> and the square is claimed and sealed.</div>
<div class="r">Turns always alternate here — no chaining. Every fusion removes a tile, so the board
always runs down. The second player gets <b>half a point</b>, so ties go to them.</div>
<div class="lbl">RECIPE</div>
<div class="r">You're each secretly given a <b>4-colour formula</b> to build, shown in order in your
own vial at the bottom of the board. Pour matching colours from the shared source tubes straight
into your vial, one at a time, in the exact order your formula needs.</div>
<div class="r">You can also pour source tube to source tube, same-colour only, to set up the colour
you need next on top. Turns always alternate — no chaining, no take-backs.</div>
<div class="r">First to complete their formula wins. You can see your own recipe in full, but only
<b>how far</b> your opponent has gotten — not what they're building. Give away too much of a colour
and you may be handing them exactly what they needed.</div>
<div style="margin-top:14px">The trap in every mode: an easy move now can hand them a one-move claim.
Watch what you set up, not just what you take.</div>
</div></div></div>`);}
registerHeaderScreen('how',how);

/* ================= PROFILE ================= */
function profile(){S.sc='profile';
const totalStars=Object.values(S.stars).reduce((a,m)=>a+Object.values(m).reduce((x,y)=>x+y,0),0);
H(`${scrOpen()}<div class="wm"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="hd"><button class="ib" data-go="menu">‹</button><h2>Profile</h2></div>
<div class="pad">${headerBar()}
<div class="lbl">NAME</div>
<input class="nmin" id="nameIn" maxlength="16" value="${E(S.name)}">
<div class="lbl">AVATAR</div>
<div class="avgrid">${AVATARS.map(a=>`<button class="avopt ${S.avatarId===a.id?'on':''}" data-av="${a.id}">${a.e}</button>`).join('')}</div>
<div class="lbl">PROGRESS</div>
<div style="display:flex;gap:9px;margin-bottom:16px">
<div class="stt"><div class="v">⭐ ${totalStars}</div><div class="l">total stars</div></div>
<div class="stt"><div class="v">${S.levelProgress.solo-1}/${LV_N.solo}</div><div class="l">solo cleared</div></div>
</div>
<button class="pr" data-go="stats"><div style="flex:1"><div style="font-size:15px;font-weight:700">Stats</div></div><span class="cv">›</span></button>
<button class="pr" data-go="ach"><div style="flex:1"><div style="font-size:15px;font-weight:700">Achievements</div></div><span class="cv">›</span></button>
</div></div>`);
const inp=document.getElementById('nameIn');
if(inp)inp.addEventListener('change',()=>{S.name=(inp.value.trim()||'Player').slice(0,16);saveState();});}
registerHeaderScreen('profile',profile);

/* ================= MODE HUB / LEVEL SELECT (duel ladders) ================= */
const HUBINFO={pour:{n:'Pour',hc:'var(--p2)',s:'Sort duel · claim a tube, go again'},
split:{n:'Split',hc:'var(--violet)',s:'Three colours each, one gold — it decides the match'},
fuse:{n:'Fuse',hc:'var(--p1)',s:'Merge equal tiles · reach 4 to claim the square'},
recipe:{n:'Recipe',hc:'var(--gold)',s:'Race to blend your secret formula first'}};
function modeHub(kind){S.sc='hub';S.curKind=kind;const info=HUBINFO[kind];
const prog=S.levelProgress[kind]-1,total=LV_N[kind];
H(`${scrOpen()}<div class="wm"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="hd"><button class="ib" data-go="menu">‹</button><h2>${info.n}</h2></div>
<div class="pad">${headerBar()}
<div class="tx" style="margin-bottom:16px">${info.s}</div>
<div class="hub-card" data-go="lvlselect" style="--hc:${info.hc}"><div class="ic">🗺️</div>
<div style="flex:1"><div class="t">Levels</div><div class="s">${prog}/${total} cleared · costs lives to fail, coins to win</div></div><span class="cv">›</span></div>
<div class="hub-card" data-go="quick-${kind}" style="--hc:${info.hc}"><div class="ic">⚡</div>
<div style="flex:1"><div class="t">Quick match</div><div class="s">Pick a difficulty, play now — free, unlimited</div></div><span class="cv">›</span></div>
<div class="hub-card" data-go="pass-${kind}" style="--hc:${info.hc}"><div class="ic">🤝</div>
<div style="flex:1"><div class="t">Pass &amp; play</div><div class="s">Local two-player, same device — free, unlimited</div></div><span class="cv">›</span></div>
</div></div>`);}
registerHeaderScreen('hub',()=>modeHub(S.curKind));

function levelSelect(kind){S.sc='lvlselect';S.curKind=kind;const total=LV_N[kind],prog=S.levelProgress[kind];
const chip=n=>{const st=S.stars[kind][n]||0,locked=n>prog;
return `<button class="lvl ${st?'done':''} ${locked?'lk':''}" data-lvd="${kind}:${n}">${locked?'🔒':(st?'✓':n)}</button>`;};
const chunks=[];for(let start=1;start<=total;start+=25){
const end=Math.min(total,start+24);const rows=[];for(let n=start;n<=end;n++)rows.push(chip(n));
chunks.push(`<div class="chap"><div class="chap-n">${start}–${end}</div>
<div class="lvlgrid">${rows.join('')}</div></div>`);}
H(`${scrOpen()}<div class="wm"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="hd"><button class="ib" data-go="hub-${kind}">‹</button><h2>${KNAME[kind]} levels</h2></div>
<div class="pad">${headerBar()}<div class="lbl">${Object.keys(S.stars[kind]).length}/${total} CLEARED · NEXT: LEVEL ${Math.min(total,prog)}</div>
${chunks.join('')}</div></div>`);}
registerHeaderScreen('lvlselect',()=>levelSelect(S.curKind));

/* ================= ROUTER ================= */
app.addEventListener('click',e=>{
const el=e.target.closest('[data-go],[data-t],[data-s],[data-start],[data-fmt],[data-bo],[data-pal],[data-bg],[data-again],[data-sn],[data-un],[data-next],[data-fr],[data-lv],[data-lvd],[data-restart],[data-av],[data-hint],[data-buy-life],[data-buy-coin],[data-buy-noads],[data-buy-starter],[data-watch],[data-spend-life],[data-ad]');
if(!el)return;ac();const d=el.dataset;
if(d.go){const v=d.go;
if(v==='mute'){S.mute=!S.mute;MUTE=!!S.mute;saveState();menu();return;}
if(v==='daily'){PENDING_ANIM='fwd';startDaily();return;}
if(v==='ach'){PENDING_ANIM='fwd';achievements();return;}
if(v==='menu'){PENDING_ANIM='back';menu();return;}
if(v.startsWith('hub-')){PENDING_ANIM='fwd';modeHub(v.slice(4));return;}
if(v==='lvlselect'){PENDING_ANIM='fwd';levelSelect(S.curKind);return;}
if(v.startsWith('quick-')){S.sc='set';PENDING_ANIM='fwd';setup(v.slice(6));return;}
if(v.startsWith('pass-')){PENDING_ANIM='fwd';start(v.slice(5),null);return;}
if(v==='solo'){PENDING_ANIM='fwd';soloLevels();return;}
if(v==='levels'){PENDING_ANIM='back';soloLevels();return;}
if(v==='shuffle'){PENDING_ANIM='fwd';startSolo(6);return;}
if(v==='store'){PENDING_ANIM='fwd';store();return;}
if(v==='stats'){PENDING_ANIM='fwd';stats();return;}
if(v==='how'){PENDING_ANIM='fwd';how();return;}
if(v==='profile'){PENDING_ANIM='fwd';profile();return;}}
if(d.start){const[k,a]=d.start.split(':');PENDING_ANIM='fwd';start(k,a);return;}
if(d.fmt){S.fmt=d.fmt;setup('pour');return;}
if(d.bo){S.bo=+d.bo;saveState();setup(S.setupKind);return;}
if(d.t!==undefined){tap(+d.t);return;}
if(d.s!==undefined){tapSolo(+d.s);return;}
if(d.lv){PENDING_ANIM='fwd';startSoloLv(+d.lv);return;}
if(d.lvd){const[k,n]=d.lvd.split(':');PENDING_ANIM='fwd';startLevelDuel(k,+n);return;}
if(d.restart){const g=S.so;
if(g.lv&&!g.done&&!g.failed)loseLife();
g.lv?startSoloLv(g.lv):startSolo(g.c);return;}
if(d.sn){startSolo(+d.sn);return;}
if(d.un){useExtraUndo();return;}
if(d.hint){d.hint==='reveal'?useRevealHint():useAddTubeHint();return;}
if(d.pal){const p=PAL.find(x=>x.id===d.pal);
if(!S.unlockedPal.includes(p.id)){if(!spendCoins(p.price)){toast('Not enough coins');return;}
S.unlockedPal.push(p.id);}
S.pal=d.pal;saveState();store();return;}
if(d.bg){const b=BGSKINS.find(x=>x.id===d.bg);
if(!S.unlockedBg.includes(b.id)){if(!spendCoins(b.price)){toast('Not enough coins');return;}
S.unlockedBg.push(b.id);}
S.bgId=d.bg;applyBg();saveState();store();return;}
if(d.av){S.avatarId=d.av;saveState();profile();return;}
if(d.buyLife){const k=d.buyLife;
if(k==='refill')S.lives=LIFE_MAX;
else if(k==='un2h')S.tempLivesUntil=Date.now()+2*3600*1000;
else if(k==='un7d')S.tempLivesUntil=Date.now()+7*24*3600*1000;
SFX.claim();toast('Purchase complete');saveState();store();return;}
if(d.buyCoin){addCoins(+d.buyCoin);SFX.claim();toast(`+${d.buyCoin} coins`);store();return;}
if(d.buyNoads){S.adsRemoved=1;SFX.claim();toast('Ads removed');saveState();store();return;}
if(d.buyStarter){S.tempLivesUntil=Math.max(S.tempLivesUntil,Date.now()+24*3600*1000);addCoins(1000);
S.unlockedBg.includes('bg2')||S.unlockedBg.push('bg2');S.starterUsed=1;SFX.claim();toast('Starter pack unlocked');saveState();store();return;}
if(d.watch){const kind=d.watch,btn=el;btn.disabled=true;btn.textContent='Loading…';
setTimeout(()=>{if(kind==='life')addLives(1);else addCoins(25);
SFX.claim();toast(kind==='life'?'+1 life':'+25 coins');store();},1200);return;}
if(d.spendLife){if(!spendCoins(75)){toast('Not enough coins');return;}
addLives(1);toast('+1 life');store();return;}
if(d.ad==='continue'){const ov=document.getElementById('adov');if(ov)ov.remove();return;}
if(d.next){matchNext();return;}
if(d.again){start(S.kind,S.aiKey);return;}
if(d.fr){const ov=document.getElementById('frov');
if(d.fr==='skip'){if(ov)ov.remove();return;}
if(d.fr==='next'){if(FR_STEP>=FR_STEPS.length-1){if(ov)ov.remove();return;}
FR_STEP++;if(ov)ov.remove();showFirstRun();return;}}});
window.addEventListener('resize',()=>{if(S.sc==='game')draw();else if(S.sc==='solo')drawSolo();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{
if(S.sc==='game')draw();else if(S.sc==='solo')drawSolo();},260));

// iOS: WebAudio starts suspended and only resumes inside a real user gesture.
// One silent buffer on the first touch unlocks it for the session.
let AUDIO_UNLOCKED=false;
function unlockAudio(){if(AUDIO_UNLOCKED)return;
try{const c=ac();const b=c.createBuffer(1,1,22050);const src=c.createBufferSource();
src.buffer=b;src.connect(c.destination);src.start(0);AUDIO_UNLOCKED=true;}catch(e){}}
document.addEventListener('touchstart',unlockAudio,{once:true,passive:true});
document.addEventListener('mousedown',unlockAudio,{once:true});

// iOS Safari fires a synthetic 300ms click and zooms on double-tap. Neither is
// wanted in a tap-heavy game.
let lastTap=0;
document.addEventListener('touchend',e=>{
const now=Date.now();
if(now-lastTap<320){e.preventDefault();}
lastTap=now;},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
// Block rubber-band drag outside scrollable panes.
document.addEventListener('touchmove',e=>{
if(!e.target.closest('.pad'))e.preventDefault();},{passive:false});

/* ================= FIRST RUN (in-memory, once per session) ================= */
let FIRSTRUN_DONE=false,FR_STEP=0;
const FR_STEPS=[
{t:'One board',s:'Every move you make changes what your opponent can do next. You share a single board.'},
{t:'Claim to seal',s:'Fill a tube — or hit the merge target — and it seals. Claimed for good, nobody can touch it again.'},
{t:'Claiming keeps your turn',s:'Seal a tube in Pour or Split and you go again. Chain claims together to swing the game.'}];
function showFirstRun(){const st=FR_STEPS[FR_STEP],last=FR_STEP===FR_STEPS.length-1;
const dots=FR_STEPS.map((_,i)=>`<i style="width:6px;height:6px;border-radius:50%;display:inline-block;background:${i===FR_STEP?'var(--p1)':'var(--edge)'}"></i>`).join(' ');
app.insertAdjacentHTML('beforeend',`<div class="frov" id="frov"><div class="frcard">
<div style="margin-bottom:14px">${dots}</div>
<h3 style="font-size:19px;font-weight:900;margin-bottom:8px">${E(st.t)}</h3>
<div style="font-size:13.5px;color:var(--mute);line-height:1.6">${E(st.s)}</div>
<div style="display:flex;gap:9px;margin-top:20px">
<button data-fr="skip" style="flex:1;padding:12px;border-radius:11px;border:1px solid var(--edge);background:transparent;color:var(--mute);font-weight:700;font-size:14px;cursor:pointer">Skip</button>
<button data-fr="next" style="flex:1;padding:12px;border-radius:11px;border:0;background:var(--p1);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer">${last?'Start':'Next'}</button>
</div></div></div>`);}
function maybeFirstRun(){if(FIRSTRUN_DONE)return;FIRSTRUN_DONE=true;FR_STEP=0;showFirstRun();}

loadState();applyBg();
menu();maybeFirstRun();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){regenLives();
const fn=HEADER_SCREENS[S.sc];if(fn)fn();}});
</script></body></html>
